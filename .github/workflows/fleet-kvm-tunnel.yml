name: Fleet KVM Tunnel

on:
  push:
    branches:
      - feat/remote-fleet-kvm-tunnel
  pull_request:
    branches:
      - feat/remote-fleet-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/test-project-probe-policy.js
      - run: node test/test-fleet-service-gateway.js
      - run: node test/test-fleet-router.js
      - run: node test/test-fleet-channel.js
      - run: node test/test-fleet-auth.js
      - name: Parse Windows Agent deployment scripts
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content deploy/fleet-windows/install-agent-task.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content deploy/fleet-windows/uninstall-agent-task.ps1 -Raw))
      - name: Parse KVM preflight script
        run: bash -n deploy/fleet-kvm/preflight-readonly.sh
